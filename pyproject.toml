[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "optima"
version = "0.1.0"
description = "Optima code analysis and LLM enrichment"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-text-splitters>=0.0.1",
    "langchain-huggingface>=0.0.1",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "clang>=16",
]

[project.optional-dependencies]
kaggle = [
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "matplotlib>=3.7.0",
    "sentence-transformers>=2.7.0",
    "tqdm>=4.66.0",
    "transformers>=4.40.0",
]

[project.scripts]
optima = "optima.__main__:main"
optima-evaluate = "evaluation.run_evaluation:main"

[tool.setuptools.packages.find]
include = ["optima", "evaluation*", "optima_kaggle"]